<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dependency Tracking</title>
    <link rel="stylesheet" href="project-robin.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1>Dependency tracking</h1>
        <p>Install actions get checked against the surrounding parts, wiring, and configuration before assembly begins. These checklists read live from the parts database — update a part's status there and the checks here update automatically.</p>
        <div class="nav-links">
          <a href="projects.html">Project hub</a>
          <a href="purchase-planner.html">Purchase planner</a>
          <a href="wiring.html">Wiring</a>
        </div>
      </header>

      <section class="panel" id="dependencyPanels"></section>
    </div>

    <script src="data/parts.js"></script>
    <script src="data/dependencies.js"></script>
    <script src="app.js"></script>
    <script>
      const parts = RobinApp.loadParts();
      const panels = document.getElementById("dependencyPanels");
      panels.innerHTML = window.ROBIN_DEPENDENCIES
        .map((rule) => `<div class="panel" style="margin-bottom: 18px;">${RobinApp.dependencyChecklistHtml(rule, parts)}</div>`)
        .join("");
    </script>
  </body>
</html>
