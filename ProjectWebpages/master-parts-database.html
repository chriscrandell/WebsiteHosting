<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Parts Database</title>
    <link rel="stylesheet" href="project-robin.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1>Master parts database</h1>
        <p>Search the build by part name, OEM number, brand, or subsystem to quickly find the latest status, replacement cadence, and sourcing notes.</p>
        <div class="nav-links">
          <a href="projects.html">Project hub</a>
          <a href="engine-manual.html">Engine manual</a>
          <a href="purchase-planner.html">Purchase planner</a>
        </div>
      </header>

      <section class="panel">
        <h2>Search parts</h2>
        <input id="searchInput" placeholder="Search for oil filter, timing chain, turbo, sensor..." />
        <div class="controls-row">
          <label>
            Display
            <select id="displayCount">
              <option value="10">10 parts</option>
              <option value="25">25 parts</option>
              <option value="50">50 parts</option>
              <option value="100">100 parts</option>
            </select>
          </label>
        </div>
        <div class="stats" style="margin-top: 16px;">
          <div class="stat">
            <span>Results</span>
            <strong id="resultCount">0</strong>
          </div>
          <div class="stat">
            <span>Installed</span>
            <strong id="installedCount">0</strong>
          </div>
          <div class="stat">
            <span>Open items</span>
            <strong id="openCount">0</strong>
          </div>
        </div>
        <div id="results" class="results-panel"></div>
      </section>
    </div>

    <script type="application/json" id="project-robin-parts-data">
      [
        { "name": "Oil Filter", "pn": "A0001802008", "brand": "Mahle", "price": 18, "installed": true, "mileage": 132422, "torque": "25 Nm", "lastChanged": "12/15/2028", "replacement": "Every oil change", "subsystem": "Lubrication" },
        { "name": "Timing Chain", "pn": "11253-2JZ", "brand": "INA", "price": 240, "installed": false, "mileage": 0, "torque": "88 Nm", "lastChanged": "Not installed", "replacement": "At overhaul", "subsystem": "Timing" },
        { "name": "Water Pump", "pn": "16100-2JZ", "brand": "Aisin", "price": 160, "installed": false, "mileage": 0, "torque": "20 Nm", "lastChanged": "Pending", "replacement": "As needed", "subsystem": "Cooling" },
        { "name": "Turbocharger", "pn": "17201-2JZ", "brand": "Precision Turbo", "price": 1450, "installed": true, "mileage": 6500, "torque": "32 Nm", "lastChanged": "02/04/2026", "replacement": "Inspect every 12 months", "subsystem": "Turbo" },
        { "name": "Fuel Pump", "pn": "7700107", "brand": "Bosch", "price": 220, "installed": true, "mileage": 8100, "torque": "8 Nm", "lastChanged": "03/10/2026", "replacement": "Every 80k", "subsystem": "Fuel" }
      ]
    </script>

    <script>
      const partsData = document.getElementById("project-robin-parts-data");
      const parts = JSON.parse(partsData.textContent);
      window.projectRobinParts = parts;

      const results = document.getElementById("results");
      const searchInput = document.getElementById("searchInput");
      const displayCount = document.getElementById("displayCount");
      const resultCount = document.getElementById("resultCount");
      const installedCount = document.getElementById("installedCount");
      const openCount = document.getElementById("openCount");

      function render() {
        const query = searchInput.value.toLowerCase();
        const filtered = parts.filter((part) => [part.name, part.pn, part.brand, part.subsystem, part.replacement].join(" ").toLowerCase().includes(query));
        const visibleCount = Number(displayCount.value);
        const visibleParts = filtered.slice(0, visibleCount);

        resultCount.textContent = filtered.length;
        installedCount.textContent = filtered.filter((part) => part.installed).length;
        openCount.textContent = filtered.filter((part) => !part.installed).length;

        if (!filtered.length) {
          results.innerHTML = '<div class="list-card"><h4>No matches yet</h4><p>Try another keyword such as oil, turbo, chain, or pump.</p></div>';
          return;
        }

        const summary = filtered.length > visibleCount ? `<p style="margin-bottom: 12px; color: var(--accent);">Showing first ${visibleCount} of ${filtered.length} matches.</p>` : "";

        results.innerHTML = `${summary}${visibleParts.map((part) => `
          <div class="list-card">
            <h4>${part.name}</h4>
            <p><strong>OEM PN:</strong> ${part.pn}</p>
            <p><strong>Brand:</strong> ${part.brand} • <strong>Price:</strong> $${part.price}</p>
            <p><strong>Installed:</strong> ${part.installed ? "Yes" : "No"} • <strong>Mileage:</strong> ${part.mileage.toLocaleString()}</p>
            <p><strong>Torque:</strong> ${part.torque} • <strong>Last changed:</strong> ${part.lastChanged}</p>
            <p><strong>Replacement:</strong> ${part.replacement}</p>
          </div>
        `).join("")}`;
      }

      searchInput.addEventListener("input", render);
      displayCount.addEventListener("change", render);
      render();
    </script>
  </body>
</html>
